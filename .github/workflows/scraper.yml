name: E-Play Contracts Scraper

on:
  schedule:
    # Run daily at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Re-enable this workflow on every run so GitHub's 60-day inactivity timer never disables the schedule
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Reset inactivity timer
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scraper.yml/enable"

  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install curl_cffi gspread google-auth cloudscraper
    
    - name: Run scraper
      env:
        CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}
        GA_COOKIE: ${{ secrets.GA_COOKIE }}
        GA_ZH4G2KK1JY: ${{ secrets.GA_ZH4G2KK1JY }}
        UPLOAD_TO_SHEETS: ${{ secrets.UPLOAD_TO_SHEETS }}
        SHEETS_CREDENTIALS_JSON: ${{ secrets.SHEETS_CREDENTIALS_JSON }}
        SHEETS_SPREADSHEET_NAME: ${{ secrets.SHEETS_SPREADSHEET_NAME }}
        SHEETS_WORKSHEET_NAME: ${{ secrets.SHEETS_WORKSHEET_NAME }}
        AUTO_REFRESH_COOKIES: ${{ secrets.AUTO_REFRESH_COOKIES }}
      run: |
        cd e-play-scraper
        # Use cloudscraper version if AUTO_REFRESH_COOKIES is enabled (best for Cloudflare)
        if [ "$AUTO_REFRESH_COOKIES" = "true" ]; then
          echo "Using cloudscraper (auto Cloudflare bypass)..."
          python cloud_scraper_cloudscraper.py
        else
          echo "Using manual cookies from secrets..."
          python cloud_scraper.py
        fi
